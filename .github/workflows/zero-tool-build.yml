name: Zero-tool build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/zero-tool-build.yml'
      - 'apps/**'
      - 'adapters/**'
      - 'bootstrap/**'
      - 'cmake/**'
      - 'examples/**'
      - 'include/**'
      - 'resources/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - '.gitmodules'
      - 'third_party/**'
      - 'vcpkg.json'
  pull_request:
    paths:
      - '.github/workflows/zero-tool-build.yml'
      - 'apps/**'
      - 'adapters/**'
      - 'bootstrap/**'
      - 'cmake/**'
      - 'examples/**'
      - 'include/**'
      - 'resources/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - '.gitmodules'
      - 'third_party/**'
      - 'vcpkg.json'

permissions:
  contents: read

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build with an empty host PATH
        run: |
          PATH=/nonexistent HPE_JOBS=4 ./bootstrap/bin/hpe-bootstrap-linux-x64 build
          install/linux-x64/hpe-cli --help
          test -x install/linux-x64/hpe-gui
          test -f install/linux-x64/gui/hpe-gui

  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build with only Windows system utilities on PATH
        shell: cmd
        run: |
          set PATH=%SystemRoot%\System32
          set HPE_JOBS=4
          bootstrap\bin\hpe-bootstrap-windows-x64.exe build
          if errorlevel 1 exit /b %errorlevel%
          install\win-x64\hpe-cli.exe --help
          if errorlevel 1 exit /b %errorlevel%
          if not exist install\win-x64\gui\hpe-gui.exe exit /b 1
